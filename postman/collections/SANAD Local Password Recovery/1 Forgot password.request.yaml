$kind: http-request
url: "{{base_url}}/api/auth/password/forgot"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"email\":  \"{{email}}\",\r

    \    \"language\":  \"en\"\r

    }"
scripts:
  - type: afterResponse
    code: if (pm.response.code === 202) { const d = pm.response.json().data; pm.collectionVariables.set("attempt_id", d.attempt_id); pm.collectionVariables.set("attempt_token", d.attempt_token); pm.collectionVariables.unset("reset_proof"); }
    language: text/javascript
order: 1000
