$kind: http-request
url: "{{base_url}}/api/auth/password/reset"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"password_confirmation\":  \"{{new_password}}\",\r

    \    \"attempt_id\":  \"{{attempt_id}}\",\r

    \    \"reset_proof\":  \"{{reset_proof}}\",\r

    \    \"password\":  \"{{new_password}}\",\r

    \    \"attempt_token\":  \"{{attempt_token}}\"\r

    }"
order: 4000
