$kind: http-request
url: "{{base_url}}/api/auth/password/otp/send"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"attempt_token\":  \"{{attempt_token}}\",\r

    \    \"attempt_id\":  \"{{attempt_id}}\"\r

    }"
order: 2000
