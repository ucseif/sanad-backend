$kind: http-request
url: "{{base_url}}/api/auth/password/otp/verify"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"attempt_id\":  \"{{attempt_id}}\",\r

    \    \"code\":  \"{{otp_code}}\",\r

    \    \"attempt_token\":  \"{{attempt_token}}\"\r

    }"
scripts:
  - type: afterResponse
    code: if (pm.response.code === 200) pm.collectionVariables.set("reset_proof", pm.response.json().data.reset_proof);
    language: text/javascript
order: 3000
