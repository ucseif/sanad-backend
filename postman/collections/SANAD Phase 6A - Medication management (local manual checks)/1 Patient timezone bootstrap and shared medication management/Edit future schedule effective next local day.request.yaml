$kind: http-request
url: "{{base_url}}/patients/{{patient_id}}/medications/{{medication_id}}"
method: PATCH
headers:
  Accept: application/json
  Idempotency-Key: "{{idempotency_key}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": "{{expected_version}}",
      "schedule": {
        "frequency": "once_daily",
        "timezone": "{{timezone}}",
        "start_date": "{{date}}",
        "end_date": null,
        "times": [
          "09:00"
        ],
        "weekdays": [],
        "interval_hours": null,
        "anchor_time": null
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{patient_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Private no-store response', () => { const h = pm.response.headers.get('Cache-Control') || ''; pm.expect(h).to.include('private'); pm.expect(h).to.include('no-store'); });
    language: text/javascript
order: 8000
