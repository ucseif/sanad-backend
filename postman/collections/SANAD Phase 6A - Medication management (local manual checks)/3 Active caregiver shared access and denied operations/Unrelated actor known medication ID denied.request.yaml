$kind: http-request
url: "{{base_url}}/patients/{{patient_id}}/medications/{{medication_id}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{unrelated_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP 404', () => pm.response.to.have.status(404));
      pm.test('Private no-store response', () => { const h = pm.response.headers.get('Cache-Control') || ''; pm.expect(h).to.include('private'); pm.expect(h).to.include('no-store'); });
    language: text/javascript
order: 7000
