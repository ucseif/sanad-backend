$kind: http-request
url: "{{base_url}}/patients/{{patient_id}}/medication-dashboard?date={{date}}&timezone={{timezone}}"
method: GET
headers:
  Accept: application/json
queryParams:
  date: "{{date}}"
  timezone: "{{timezone}}"
auth:
  type: bearer
  credentials:
    token: "{{caregiver_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Private no-store response', () => { const h = pm.response.headers.get('Cache-Control') || ''; pm.expect(h).to.include('private'); pm.expect(h).to.include('no-store'); });
    language: text/javascript
order: 3000
