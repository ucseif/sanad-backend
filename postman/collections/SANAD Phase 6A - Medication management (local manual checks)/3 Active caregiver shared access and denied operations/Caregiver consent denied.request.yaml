$kind: http-request
url: "{{base_url}}/patients/{{patient_id}}/medications/{{medication_id}}/escalation-consent"
method: PATCH
headers:
  Accept: application/json
  Idempotency-Key: "{{idempotency_key}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": "{{preferences_version}}",
      "notify_caregiver_if_missed": true
    }
auth:
  type: bearer
  credentials:
    token: "{{caregiver_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP 403', () => pm.response.to.have.status(403));
      pm.test('Private no-store response', () => { const h = pm.response.headers.get('Cache-Control') || ''; pm.expect(h).to.include('private'); pm.expect(h).to.include('no-store'); });
    language: text/javascript
order: 6000
