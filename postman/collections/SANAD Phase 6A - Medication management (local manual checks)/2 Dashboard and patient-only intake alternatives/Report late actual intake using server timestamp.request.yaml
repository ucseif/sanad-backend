$kind: http-request
description: For a currently Missed dose. Optionally add actual_intake_at with the actual nonfuture RFC3339 timestamp, including an earlier intake reported offline.
url: "{{base_url}}/patients/{{patient_id}}/medication-doses/{{dose_id}}/late-intake"
method: POST
headers:
  Accept: application/json
  Idempotency-Key: "{{idempotency_key}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": "{{dose_version}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{patient_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Private no-store response', () => { const h = pm.response.headers.get('Cache-Control') || ''; pm.expect(h).to.include('private'); pm.expect(h).to.include('no-store'); });
    language: text/javascript
order: 6000
