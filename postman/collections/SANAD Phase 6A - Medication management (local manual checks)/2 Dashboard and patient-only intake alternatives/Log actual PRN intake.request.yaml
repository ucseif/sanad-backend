$kind: http-request
url: "{{base_url}}/patients/{{patient_id}}/medications/{{medication_id}}/prn-intakes"
method: POST
headers:
  Accept: application/json
  Idempotency-Key: "{{idempotency_key}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expected_version": "{{expected_version}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{patient_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expected HTTP 201', () => pm.response.to.have.status(201));
      pm.test('Private no-store response', () => { const h = pm.response.headers.get('Cache-Control') || ''; pm.expect(h).to.include('private'); pm.expect(h).to.include('no-store'); });
    language: text/javascript
order: 9000
